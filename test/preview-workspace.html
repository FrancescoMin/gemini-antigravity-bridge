<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Dummy remote workspace</title>
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box}html,body{margin:0;height:100%;background:#101010;color:#ddd;font:14px system-ui;color-scheme:dark}
  body{display:flex;flex-direction:column}
  header{height:40px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;overflow:hidden;min-width:0;width:100%;padding-right:46px}
  .breadcrumb{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:20px;color:#aaa}
  .actions{display:flex;align-items:center;height:100%;flex-shrink:0;gap:4px}
  .native{height:28px;width:28px;padding:0;border:0;border-radius:8px;background:none;color:#aaa;font:20px system-ui}
  .reserve{height:100%;flex-shrink:0;width:105px}
  main{flex:1;display:grid;place-content:center;text-align:center;color:#aaa;padding:20px}
  h1{font-size:23px;color:#eee;font-weight:500}
</style>
<header>
  <div class="breadcrumb">Example project / Example conversation</div>
  <div class="actions">
    <button class="native" data-testid="titlebar-more-actions" aria-label="More actions">⋮</button>
    <button class="native" data-testid="toggle-overview-panel" aria-label="Overview">▤</button>
    <div class="reserve"></div>
  </div>
</header>
<main><h1>Native toolbar preview</h1><p>Real extension code, dummy interface. No connection to a remote PC.</p><p>Gemini occupies its own space before More actions.</p></main>
<script>window.chrome={runtime:{getURL:path=>new URL('../'+path,location.href).href}};</script>
<script src="../bridge-config.js"></script>
<script src="../content.js"></script>
</html>
