<!doctype html>
<html lang="en">
<meta charset="utf-8">

<title>README preview — synthetic empty workspace</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;background:#101010;color:#dfe1e6;font-family:Arial,sans-serif;width:1024px;overflow:hidden}
  button{font:inherit;color:inherit;cursor:default}svg{display:block;fill:none;stroke:currentColor;stroke-width:1.4}
  .gemini{height:512px;position:relative;background:#101010}
  .window-bar{height:18px;display:flex;align-items:center;gap:10px;padding:0 8px 0 5px;background:#092025;font:8px Georgia,serif;color:white}
  .window-bar img{width:10px;height:10px}.window-bar .space{flex:1}.window-bar .window-control{width:21px;text-align:center}
  .gemini-body{position:relative;height:494px;background:radial-gradient(ellipse 310px 185px at 52% 58%,#1b295e 0%,#101728 63%,#101010 100%)}
  .rail{position:absolute;left:0;top:0;width:33px;height:100%;display:flex;align-items:center;flex-direction:column;gap:12px;padding-top:6px;color:#e1e4e8}
  .rail img{width:16px;height:16px}.rail .round{width:23px;height:23px;display:grid;place-items:center;background:#242529;border-radius:50%}
  .rail svg{width:10px;height:10px}.rail .bottom{margin-top:auto;display:flex;flex-direction:column;gap:17px;padding-bottom:8px}
  .gemini-action{position:absolute;right:11px;top:8px;display:flex;gap:8px;align-items:center}
  .gemini-action .attachment{border:0;background:none;font-size:15px;margin-right:9px;color:#aaa}
  .pill{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:22px;padding:0 8px;border:1px solid #393939;border-radius:13px;background:#171717;color:#e7e7e7;font-size:9px;white-space:nowrap}
  .pill img{width:12px;height:12px;object-fit:contain}
  .gemini h1{position:absolute;top:193px;left:0;width:100%;text-align:center;margin:0;font-size:21px;font-weight:400;letter-spacing:-.4px}
  .gemini-composer{position:absolute;left:330px;top:244px;width:397px;height:40px;background:#202020;border-radius:23px;display:flex;align-items:center;gap:10px;padding:0 15px;font-size:9px;color:#ced0d4}
  .gemini-composer .plus{font-size:20px;font-weight:300;color:#9ea0a6}.gemini-composer .input{flex:1}.gemini-composer .model{font-size:8px}.gemini-composer svg{width:11px;height:12px;margin-left:10px}
  .antigravity{height:262px;position:relative;background:#101010;font-size:7px;color:#b6b6b6}
  .ag-header{height:21px;display:flex;align-items:center;padding:0 4px 0 8px;gap:9px}
  .ag-header .brand{color:#eee;font-size:7px}.ag-header svg{width:8px;height:8px}.ag-header .stretch{flex:1}
  .ag-header .pill{height:15px;padding:0 5px;gap:3px;font-size:7px;background:#252525;border-color:#3a3a3a}
  .ag-header .pill img{width:9px;height:9px}
  .ag-workspace{position:absolute;left:335px;top:180px;width:378px}
  .project{height:15px;display:flex;gap:4px;align-items:flex-start;padding-left:5px;color:#8c8e93;font-size:6.5px}.project svg{width:7px;height:7px}
  .ag-composer{height:57px;border:1px solid #2a2a2a;border-radius:8px;background:#202020;overflow:hidden;color:#8d8e92}
  .ag-input{height:22px;padding:8px 6px 0;font-size:7px}
  .ag-controls{height:20px;display:flex;align-items:center;gap:8px;padding:0 7px;font-size:6px}.ag-controls .stretch{flex:1}.ag-controls .plus{font-size:9px}.ag-controls .send{border-radius:50%;width:13px;height:13px;background:#353535;display:grid;place-items:center;font-size:11px}.ag-controls svg{width:8px;height:8px}
  .ag-footer{height:15px;background:#292929;padding:3px 7px;font-size:6px;display:flex;gap:4px;align-items:center}.ag-footer svg{width:7px;height:7px}
</style>
<body>

<script>
